[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "321vegan-discord-bot"
version = "0.1.0"
description = "Discord product-validation bot for 321Vegan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.5,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
321vegan-discord-bot = "vegan_discord_bot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
