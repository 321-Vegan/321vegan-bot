services:
  bot:
    build:
      context: .
    image: 321vegan-discord-bot:latest
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
